services:
  api:
    build: .
    container_name: mkb-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"

  web:
    image: nginx:1.27-alpine
    container_name: mkb-web
    restart: unless-stopped
    ports:
      - "9400:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
